<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes | HelpDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-roxa"><div class="container"><a class="navbar-brand fw-bold" href="chamados.html">HelpDesk Escolar</a><div class="d-flex align-items-center gap-3"><a class="small" href="chamados.html">Voltar</a><span class="small" id="usuario-logado"></span><button class="btn btn-sm btn-outline-primary" data-logout>Sair</button></div></div></nav>
  <main class="container py-5 detalhes-container">
    <div id="mensagem" class="mensagem escondido"></div>
    <section id="detalhes-chamado" class="card border-0 shadow-sm mb-4"><div class="card-body p-4"><p>Carregando chamado...</p></div></section>
    <section id="edicao" class="card border-0 shadow-sm mb-4 escondido"><div class="card-body p-4">
      <h2 class="h4 mb-3">Editar chamado</h2>
      <form id="form-edicao"><div class="mb-3"><label class="form-label" for="editar-titulo">Título</label><input class="form-control" id="editar-titulo" required></div><div class="mb-3"><label class="form-label" for="editar-descricao">Descrição</label><textarea class="form-control" id="editar-descricao" rows="5" minlength="10" required></textarea></div><div class="d-flex gap-2"><button class="btn btn-primary">Salvar alterações</button><button type="button" class="btn btn-light border" id="cancelar-edicao">Cancelar</button></div></form>
    </div></section>
    <section class="card border-0 shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3">Comentários</h2>
      <div id="lista-comentarios"></div>
      <form id="form-comentario" class="mt-4"><label class="form-label" for="comentario">Novo comentário</label><textarea class="form-control" id="comentario" rows="3" maxlength="2000" required></textarea><button class="btn btn-primary mt-3">Comentar</button></form>
    </div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/chamados.js"></script>
</body>
</html>
