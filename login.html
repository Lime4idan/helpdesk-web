<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HelpDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-roxa"><div class="container"><a class="navbar-brand fw-bold" href="index.html">HelpDesk Escolar</a><a href="cadastro.html">Criar conta</a></div></nav>
  <main class="container py-5">
    <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
      <section class="card card-form border-0 shadow-sm"><div class="card-body p-4 p-md-5">
        <h1 class="h2 mb-2">Entrar</h1>
        <p class="text-secondary mb-4">Informe seus dados para acessar.</p>
        <div id="mensagem" class="mensagem escondido"></div>
        <form id="form-login">
          <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required></div>
          <div class="mb-4"><label class="form-label" for="senha">Senha</label><input class="form-control" id="senha" name="senha" type="password" required></div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <p class="text-center mt-4 mb-0">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div></section>
    </div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
