<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | HelpDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-roxa"><div class="container"><a class="navbar-brand fw-bold" href="index.html">HelpDesk Escolar</a><a href="login.html">Já tenho conta</a></div></nav>
  <main class="container py-5">
    <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
      <section class="card card-form border-0 shadow-sm"><div class="card-body p-4 p-md-5">
        <h1 class="h2 mb-2">Criar conta</h1>
        <p class="text-secondary mb-4">Preencha os dados abaixo.</p>
        <div id="mensagem" class="mensagem escondido"></div>
        <form id="form-cadastro">
          <div class="mb-3"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" name="nome" required minlength="3"></div>
          <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required></div>
          <div class="mb-3"><label class="form-label" for="senha">Senha</label><input class="form-control" id="senha" name="senha" type="password" minlength="6" required><div class="form-text">Use pelo menos 6 caracteres.</div></div>
          <div class="mb-4"><label class="form-label" for="tipo">Tipo de usuário</label><select class="form-select" id="tipo" name="tipo"><option value="cliente">Cliente</option><option value="tecnico">Técnico</option></select></div>
          <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
        </form>
      </div></section>
    </div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script>
</body>
</html>
